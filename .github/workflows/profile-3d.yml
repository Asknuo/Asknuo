name: GitHub-Profile-3D-Contrib

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at 02:00 China Standard Time (UTC+8).
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Generate language breakdown from commit contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate-contribution-languages.py
      - name: Commit generated profile images
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "generated"
          git push
